name: Sync demo branch

on:
  push:
    branches: [main]

concurrency:
  group: sync-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-demo:
    if: github.repository == 'anyrange/uptime-zero'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebase demo branch on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main demo
          git checkout -B demo origin/demo
          git rebase origin/main
          mkdir -p .cloudflare
          git rev-parse origin/main > .cloudflare/demo-source-sha
          git add .cloudflare/demo-source-sha
          git commit -m "chore: record demo source sha" || true
          git push origin demo --force-with-lease

      - name: Rebase demo-bak branch on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main demo-bak
          git checkout -B demo-bak origin/demo-bak
          git rebase origin/main
          mkdir -p .cloudflare
          git rev-parse origin/main > .cloudflare/demo-source-sha
          git add .cloudflare/demo-source-sha
          git commit -m "chore: record demo source sha" || true
          git push origin demo-bak --force-with-lease
